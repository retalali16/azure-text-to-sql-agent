events {}

http {
  upstream backend {
    # Docker's internal DNS round-robins across all "app" replicas automatically.
    server app:8000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
