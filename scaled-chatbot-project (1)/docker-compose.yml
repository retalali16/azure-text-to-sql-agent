services:
  app:
    build: ./backend
    env_file: ./backend/.env
    deploy:
      replicas: 3
    depends_on:
      - redis
    expose:
      - "9000"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  nginx:
    image: nginx:alpine
    ports:
      - "90:90"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
